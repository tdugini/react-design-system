name: Bootstrap scaffold

on:
  push:
    branches:
      - feature/initial-design-system
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/initial-design-system
          fetch-depth: 0

      - name: Materialize scaffold
        run: |
          base64 --decode .bootstrap/scaffold.tar.gz.b64 > "$RUNNER_TEMP/scaffold.tar.gz"
          tar -xzf "$RUNNER_TEMP/scaffold.tar.gz" -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml

      - name: Commit scaffold
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add initial TD/UI design system"
          git push origin HEAD:feature/initial-design-system
