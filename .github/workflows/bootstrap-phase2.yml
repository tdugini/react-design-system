name: Bootstrap interaction patterns

on:
  push:
    branches:
      - feature/interaction-patterns
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap-phase2.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: feature/interaction-patterns
          fetch-depth: 0

      - name: Materialize phase two
        run: |
          cat .bootstrap/part-* > "$RUNNER_TEMP/phase2.tar.gz.b64"
          base64 --decode "$RUNNER_TEMP/phase2.tar.gz.b64" > "$RUNNER_TEMP/phase2.tar.gz"
          echo "e0729d21f1546c8f7652ebec49376e6ca18cd225d1e6c1f40086e4ee410f434f  $RUNNER_TEMP/phase2.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/phase2.tar.gz" -C .
          rm -rf .bootstrap

      - name: Commit interaction patterns
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add interaction patterns and Storybook workshop"
          git push origin HEAD:feature/interaction-patterns
